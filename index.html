    // Calcula para cada día hábil (Lunes a Sábado) su última ocurrencia real (hoy o el último pasado)
    // Ejemplo: si hoy es Martes 17/11, Lunes=16/11, Martes=17/11 (HOY), Miércoles=11/11 (sem. ant.), etc.
    const obtenerCalendarioUltimosDiasHabiles = (fechaBase = new Date()) => {
      const mapaDow = { Lunes: 1, Martes: 2, Miércoles: 3, Jueves: 4, Viernes: 5, Sábado: 6 };
      const dowHoy = fechaBase.getDay(); // 0=Dom, 1=Lun .. 6=Sab
      const hoyIso = `${fechaBase.getFullYear()}-${String(fechaBase.getMonth() + 1).padStart(2, '0')}-${String(fechaBase.getDate()).padStart(2, '0')}`;

      return DIAS_SEMANA.map((nombreDia) => {
        const targetDow = mapaDow[nombreDia];
        // Si hoy es Domingo (0), todos los días Lunes..Sábado fueron hace 6..1 días
        let diffDias = dowHoy === 0 ? (7 - targetDow) : (dowHoy - targetDow);
        if (diffDias < 0) diffDias += 7; // Si el día aún no llegó esta semana, apunta al de la semana pasada

        const dObj = new Date(fechaBase.getFullYear(), fechaBase.getMonth(), fechaBase.getDate() - diffDias);
        const iso = `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
        const dd = String(dObj.getDate()).padStart(2, '0');
        const mm = String(dObj.getMonth() + 1).padStart(2, '0');
        const yy = String(dObj.getFullYear()).slice(-2);
        const yyyy = String(dObj.getFullYear());

        return {
          nombreDia,
          iso,
          corta: `${dd}/${mm}`,
          completa: `${dd}/${mm}/${yy}`,
          completaAnio: `${dd}/${mm}/${yyyy}`,
          esHoy: iso === hoyIso,
          esAyer: diffDias === 1,
          esSemanaAnterior: diffDias >= 4 && dowHoy !== 0 && targetDow > dowHoy
        };
      });
    };

    const formatearHorarioTexto = (horario) => {
      if (!horario) return '08:00 a 13:00 hs';
      if (horario.tipo === '24hs') return 'Abierto 24 hs';
      const t1 = `${horario.mananaIni || '08:00'} a ${horario.mananaFin || '13:00'} hs`;
      if (horario.tipo === 'cortado' && horario.tardeIni && horario.tardeFin) {
        return `${t1} / ${horario.tardeIni} a ${horario.tardeFin} hs`;
      }
      return t1;
    };

    const evaluarEstadoHorario = (horario, horaStr) => {
      if (!horario || horario.tipo === '24hs') return { estado: 'abierto24', texto: '24 hs', minutosParaCerrar: 999 };
      const [h, m] = (horaStr || '12:00').split(':').map(Number);
      const minAct = h * 60 + m;
      const toMin = (s) => {
        if (!s || !s.includes(':')) return null;
        const [hh, mm] = s.split(':').map(Number);
        return hh * 60 + mm;
      };
      const m1Fin = toMin(horario.mananaFin);
      const m1Ini = toMin(horario.mananaIni);
      if (m1Ini !== null && m1Fin !== null && minAct >= m1Ini && minAct < m1Fin) {
        const restan = m1Fin - minAct;
        return restan <= 45
          ? { estado: 'por_cerrar', texto: `Cierra en ${restan} min (${horario.mananaFin})`, minutosParaCerrar: restan }
          : { estado: 'abierto', texto: `Hasta ${horario.mananaFin} hs`, minutosParaCerrar: restan };
      }
      return { estado: 'abierto', texto: formatearHorarioTexto(horario), minutosParaCerrar: 180 };
    };

      if (cliente.estado === 'Visitado' && cliente.ultimaOperacion) ops.push(cliente.ultimaOperacion);

          const normalizarTxt = (s) =>
            String(s || '')
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .toUpperCase()
              .replace(/[^A-Z0-9\s]/g, ' ')
              .replace(/\s+/g, ' ')

          const parsearNumero = (val) => {
            if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
            const str = String(val || '').replace(/[$\s]/g, '').trim();
            if (!str) return 0;
            // Soporta tanto formato AR (1.250,50) como US (1,250.50)
            const limpio = str.includes(',') && str.includes('.')
              ? (str.lastIndexOf(',') > str.lastIndexOf('.') ? str.replace(/\./g, '').replace(',', '.') : str.replace(/,/g, ''))
              : str.includes(',')
              ? str.replace(',', '.')
              : str.replace(/\.(?=\d{3}\b)/g, '');
            const n = parseFloat(limpio);

            const buf = await file.arrayBuffer();
            const wb = XLSX.read(buf, { type: 'array' });
            const matchFecha = file.name.match(/(\d{1,2})[-_](\d{1,2})(?:[-_](\d{2,4}))?/);
            const diaNum = matchFecha ? parseInt(matchFecha[1], 10) : ahoraReal.getDate();

            let opsArchivo = 0;

            wb.SheetNames.forEach((sheetName) => {
              const sNorm = normalizarTxt(sheetName);

              let vendedorSheet = null;
              if (sNorm.includes('GABRIEL') || sNorm.includes('VENDEDOR A')) vendedorSheet = 'A';

              const tieneSolapasReparto = wb.SheetNames.some((n) => {
                const nn = normalizarTxt(n);

              });
              if (tieneSolapasReparto && !vendedorSheet) return;

              const sheet = wb.Sheets[sheetName];
              const matriz = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
              if (!matriz || matriz.length < 2) return;

              // Determinar ruta del día según vendedor y fecha del archivo

              let idxHeader = -1;
              for (let i = 0; i < Math.min(15, matriz.length); i++) {

                const coincide = fila.some((cel) => {
                  const t = normalizarTxt(cel);
                  return t === 'CLIENTE' || t === 'COMERCIO' || t.includes('NOMBRE') || t.includes('RAZON SOCIAL') || t.includes('LOCAL');
                });
                if (coincide) {
                  idxHeader = i;
                  break;
                }
              }
              if (idxHeader === -1) idxHeader = 0;
              const headers = (matriz[idxHeader] || []).map((h) => normalizarTxt(h));

              let colCliente = headers.findIndex((h) => h === 'CLIENTE' || h === 'COMERCIO' || h.includes('CLIENTE') || h.includes('COMERCIO') || h.includes('NOMBRE'));
              if (colCliente === -1) colCliente = 0;
              const colDireccion = headers.findIndex((h) => h.includes('DIRECCION') || h.includes('DOMICILIO') || h.includes('CALLE'));
              const colLocalidad = headers.findIndex((h) => h.includes('LOCALIDAD') || h.includes('ZONA') || h.includes('BARRIO'));

              const colPromo = headers.findIndex((h) => h.includes('PROMO') || h.includes('BONIF'));
              const colPago = headers.findIndex((h) => h.includes('PAGO') || h.includes('COND') || h.includes('CTA') || h.includes('TRANSF') || h.includes('EFECTIVO'));

              // Mapear columnas de productos por coincidencia flexible de nombre
              const colsProductos = [];
              headers.forEach((h, cIdx) => {
                if ([colCliente, colDireccion, colLocalidad, colTelefono, colTotal, colCambio, colPromo, colPago].includes(cIdx) || !h) return;
                const prodMatch = CATALOGO_PRODUCTOS.find((p) => {
                  const pBase = normalizarTxt(p.nombre).split(' X ')[0].trim();
                  return h.includes(pBase) || (pBase.length >= 5 && pBase.includes(h) && h.length >= 4);
                });
                if (prodMatch) colsProductos.push({ cIdx, prod: prodMatch });
              });

              for (let r = idxHeader + 1; r < matriz.length; r++) {
                const fila = matriz[r] || [];
                const rawCli = String(fila[colCliente] ?? '').trim();
                const nomNorm = normalizarTxt(rawCli);
                if (!nomNorm || nomNorm.length < 2) continue;
                if (nomNorm.startsWith('TOTAL') || nomNorm.startsWith('SUBTOTAL') || nomNorm === 'CLIENTE' || nomNorm === 'COMERCIO' || nomNorm.startsWith('REPARTO ')) continue;

                const itemsVendidos = {};
                let sumaProductos = 0;
                colsProductos.forEach(({ cIdx, prod }) => {
                  const qty = Math.round(parsearNumero(fila[cIdx]));
                  if (qty > 0) {
                    itemsVendidos[prod.id] = (itemsVendidos[prod.id] || 0) + qty;
                    sumaProductos += qty * prod.precio;
                  }
                });

                const montoLeido = colTotal >= 0 ? parsearNumero(fila[colTotal]) : 0;
                const totalVenta = montoLeido > 0 ? montoLeido : sumaProductos;
                const totalCambio = colCambio >= 0 ? parsearNumero(fila[colCambio]) : 0;
                const totalPromoValor = colPromo >= 0 ? parsearNumero(fila[colPromo]) : 0;

                const esOtras = nomNorm.includes('OTRA') || nomNorm.includes('VARI') || nomNorm.includes('MOSTRADOR') || nomNorm.includes('SIN IDENT');

                // Buscar cliente existente en la ruta detectada o en todo el padrón
                let rutaDestino = rutaDetectada || 'R-1';
                let clienteDestino = null;

                if (!esOtras) {
                  const buscarEn = rutaDetectada ? [rutaDetectada, ...Object.keys(nuevoEstado).filter((k) => k !== rutaDetectada)] : Object.keys(nuevoEstado);
                  for (const rKey of buscarEn) {
                    const encontrado = (nuevoEstado[rKey] || []).find((c) => {
                      if (c.esOtrasVentas) return false;
                      const cNorm = normalizarTxt(c.nombre);
                      const cBase = cNorm.split('(')[0].trim();
                      return cNorm === nomNorm || (cBase.length >= 4 && (nomNorm.includes(cBase) || cBase.includes(nomNorm)));
                    });
                    if (encontrado) {
                      rutaDestino = rKey;
                      clienteDestino = encontrado;
                      clientesExistentesMatch += 1;
                      break;
                    }
                  }

                  // Si el cliente del Excel no existía aún en la base, DARLO DE ALTA automáticamente en esa ruta
                  if (!clienteDestino) {
                    const listaActual = nuevoEstado[rutaDestino] || [];
                    const realesCount = listaActual.filter((c) => !c.esOtrasVentas).length;
                    const nuevoClienteObj = {
                      id: `${rutaDestino}-C-${String(realesCount + 1).padStart(3, '0')}`,
                      orden: realesCount + 1,
                      nombre: rawCli.toUpperCase(),
                      contacto: '',
                      direccion: colDireccion >= 0 ? String(fila[colDireccion] || '').trim() : '',
                      localidad: colLocalidad >= 0 && fila[colLocalidad] ? String(fila[colLocalidad]).trim().toUpperCase() : (NOMBRES_RUTAS[rutaDestino] || 'TUCUMÁN'),
                      telefono: colTelefono >= 0 ? String(fila[colTelefono] || '').trim() : '',
                      lat: null,
                      lng: null,
                      horario: { tipo: 'cortado', mananaIni: '08:00', mananaFin: '13:00', tardeIni: '17:00', tardeFin: '21:00' },
                      estado: 'Pendiente',
                      ultimaOperacion: null,
                      historialPrevio: [],
                      esOtrasVentas: false,
                      esNuevo: true
                    };
                    // Insertar antes del comodín OTRAS VENTAS
                    const idxComodin = listaActual.findIndex((c) => c.esOtrasVentas);
                    if (idxComodin >= 0) listaActual.splice(idxComodin, 0, nuevoClienteObj);
                    else listaActual.push(nuevoClienteObj);
                    nuevoEstado[rutaDestino] = listaActual;
                    clienteDestino = nuevoClienteObj;
                    clientesNuevosDadosDeAlta += 1;
                  }
                } else {
                  clienteDestino = (nuevoEstado[rutaDestino] || []).find((c) => c.esOtrasVentas) || (nuevoEstado[rutaDestino] || [])[0];
                  filasOtrasVentas += 1;
                }

                // Si la fila tiene monto o productos vendidos, registrar operación en el historial del cliente
                if (clienteDestino && (totalVenta > 0 || totalCambio > 0 || totalPromoValor > 0 || Object.keys(itemsVendidos).length > 0)) {
                  const pagoNorm = colPago >= 0 ? normalizarTxt(fila[colPago]) : '';
                  const metodoPago = pagoNorm.includes('CTA') || pagoNorm.includes('CORRIENTE') || pagoNorm.includes('FIADO')
                    ? 'Cuenta Corriente'
                    : pagoNorm.includes('TRANSF') || pagoNorm.includes('MP') || pagoNorm.includes('ALIAS')
                    ? 'Transferencia'
                    : 'Efectivo';

                  const nroComp = `IMP-${fIso.replace(/-/g, '')}-${String(totalOps + 1).padStart(4, '0')}`;
                  clienteDestino.historialPrevio = (clienteDestino.historialPrevio || []).filter(
                    (h) => !(h.fecha === fIso && h.origenExcel === file.name && h.totalVenta === totalVenta)
                  );
                  clienteDestino.historialPrevio.push({
                    fecha: fIso,
                    numeroComprobante: nroComp,
                    hora: '12:00',
                    totalVenta,
                    totalCambio,
                    totalPromoValor,
                    neto: totalVenta - totalCambio,
                    metodoPago,
                    itemsVendidos,
                    itemsCambiados: {},
                    itemsPromocion: {},
                    origenExcel: file.name,
                    repartidor: vendedorSheet || ''
                  });

                  if (vendedorSheet && resumenPorRepartidor[vendedorSheet]) {
                    resumenPorRepartidor[vendedorSheet].ops += 1;
                    resumenPorRepartidor[vendedorSheet].monto += totalVenta;
                  }

                  opsArchivo += 1;
                  montoArchivo += totalVenta;
                  totalOps += 1;
                  totalMonto += totalVenta;
                }
              }
            });

            detallePorFecha[fIso] = { archivo: file.name, dia: nombreDiaArchivo, ops: opsArchivo, monto: montoArchivo };
          }

          setRutasData(nuevoEstado);
          setResumenImportacion({
            archivosProcesados: files.length,
            filasProcesadas: totalOps,
            montoTotalImportado: totalMonto,
            clientesIdentificados: clientesExistentesMatch,
            clientesNuevosDadosDeAlta,
            filasOtrasVentas,
            detallePorFecha,
            resumenPorRepartidor
          });
          mostrarToast(`Importados ${files.length} archivos (${clientesNuevosDadosDeAlta} clientes nuevos dados de alta)`);
        } catch (err) {
          mostrarToast('Error al leer alguno de los archivos Excel', 'error');
        } finally {
          setProcesandoLoteExcel(false);
          e.target.value = '';
        }
      };

      const manejarSubmitLogin = (e) => {
        e.preventDefault();
        const found = usuariosSistema.find(
          (u) => u.usuario.toLowerCase() === loginUser.trim().toLowerCase() && u.password === loginPass
        );
        if (!found) {
          setLoginError('Usuario o contraseña incorrectos.');
          return;
        }
        setLoginError('');
        iniciarSesion(found);
      };

      const cerrarSesion = () => {

        localStorage.removeItem('bp_sesion_activa_v1');
      };

      const vendedorObj = PLANIFICACION_VENDEDORES[vendedorId] || PLANIFICACION_VENDEDORES.A;
      const agendaDia = vendedorObj.agenda[diaActivo] || { rutaId: null, nombre: 'Sin Ruta', objetivo: 0 };
      const rutaActivaId = usarSubRuta && agendaDia.subRutaId ? agendaDia.subRutaId : agendaDia.rutaId;
      const rutaActivaNombre = usarSubRuta && agendaDia.subNombre ? agendaDia.subNombre : agendaDia.nombre;
      const objetivoDia = agendaDia.objetivo || 0;
      const clientesRuta = useMemo(() => (rutaActivaId ? rutasData[rutaActivaId] || [] : []), [rutasData, rutaActivaId]);

      const metricas = useMemo(() => {
        let ventaBruta = 0, totalCambios = 0, recaudadoEfectivo = 0, recaudadoTransferencia = 0, saldoCtaCte = 0, visitados = 0;
        const stockDisp = { ...stockInicial };
        clientesRuta.forEach((cli) => {
          if (cli.estado === 'Visitado' || cli.estado === 'Sin Compra') visitados += 1;
          if (cli.estado === 'Visitado' && cli.ultimaOperacion) {
            const op = cli.ultimaOperacion;
            ventaBruta += op.totalVenta || 0;
            totalCambios += op.totalCambio || 0;
            if (op.metodoPago === 'Efectivo') recaudadoEfectivo += op.neto || 0;
            if (op.metodoPago === 'Transferencia') recaudadoTransferencia += op.neto || 0;
            if (op.metodoPago === 'Cuenta Corriente') saldoCtaCte += op.neto || 0;
            Object.entries(op.itemsVendidos || {}).forEach(([pid, q]) => {
              if (stockDisp[pid] !== undefined) stockDisp[pid] = Math.max(0, stockDisp[pid] - q);
            });
          }
        });
        const ventaNeta = ventaBruta - totalCambios;
        const porcentajeObjetivo = objetivoDia > 0 ? Math.round((ventaNeta / objetivoDia) * 100) : 0;
        return {
          ventaBruta,
          totalCambios,
          ventaNeta,
          recaudadoEfectivo,
          recaudadoTransferencia,
          saldoCtaCte,
          visitados,
          stockDisponible: stockDisp,
          porcentajeObjetivo,
          faltaObjetivo: Math.max(0, objetivoDia - ventaNeta),
          superadoObjetivo: Math.max(0, ventaNeta - objetivoDia)
        };
      }, [clientesRuta, stockInicial, objetivoDia]);

      const resumenPorVendedorEscritorio = useMemo(() => {
        const fechaObjetivoIso = infoDiaSeleccionado?.iso;
        const esJornadaDeHoy = infoDiaSeleccionado?.esHoy;

        return ['A', 'B', 'C'].map((vId) => {
          const vObj = PLANIFICACION_VENDEDORES[vId];
          const ag = vObj.agenda[diaActivo] || { rutaId: null, nombre: 'Sin Ruta', objetivo: 0 };
          const rId = ag.rutaId;
          const lista = rId ? (rutasData[rId] || []).filter((c) => !c.esOtrasVentas) : [];
          let visitados = 0, ventaBruta = 0, totalCambiosMonto = 0, totalCambiosUnidades = 0;
          let totalTransferencias = 0, totalCtaCte = 0, totalPromosUnidades = 0, totalPromosMonto = 0;

          lista.forEach((cli) => {
            const opsDelDia = [];
            (cli.historialPrevio || []).forEach((h) => {
              if (h.fecha === fechaObjetivoIso) opsDelDia.push(h);
            });
            if (cli.estado === 'Visitado' && cli.ultimaOperacion) {
              const fOp = cli.ultimaOperacion.fecha || infoHoyReal?.iso;
              if (fOp === fechaObjetivoIso) opsDelDia.push(cli.ultimaOperacion);
            }

            if (opsDelDia.length > 0 || (esJornadaDeHoy && cli.estado === 'Sin Compra')) {
              visitados += 1;
            }

            opsDelDia.forEach((op) => {
              ventaBruta += op.totalVenta || 0;
              totalCambiosMonto += op.totalCambio || 0;
              if (op.metodoPago === 'Transferencia') totalTransferencias += op.neto || 0;
              if (op.metodoPago === 'Cuenta Corriente') totalCtaCte += op.neto || 0;
              Object.values(op.itemsCambiados || {}).forEach((q) => { totalCambiosUnidades += q || 0; });
              Object.entries(op.itemsPromocion || {}).forEach(([pid, q]) => {
                const p = CATALOGO_PRODUCTOS.find((x) => x.id === pid);
                totalPromosUnidades += q || 0;
                totalPromosMonto += (p ? p.precio : 0) * (q || 0);
              });
            });
          });

          const facturacionNeta = ventaBruta - totalCambiosMonto;
          const objetivo = ag.objetivo || 0;
          const cumplimientoRutaPct = lista.length > 0 ? Math.round((visitados / lista.length) * 100) : 0;
          const cumplimientoObjPct = objetivo > 0 ? Math.round((facturacionNeta / objetivo) * 100) : 0;

          return {
            vendedorId: vId,
            nombre: vObj.nombre,
            vehiculo: vObj.vehiculo,
            zonaMacro: vObj.zonaMacro,
            rutaId: rId,
            nombreRuta: ag.nombre,
            totalClientes: lista.length,
            visitados,
            cumplimientoRutaPct,
            facturacionNeta,
            objetivo,
            cumplimientoObjPct,
            objetivoCumplido: objetivo > 0 && facturacionNeta >= objetivo,
            faltaObjetivo: Math.max(0, objetivo - facturacionNeta),
            superadoObjetivo: Math.max(0, facturacionNeta - objetivo),
            totalTransferencias,
            totalCtaCte,
            totalPromosUnidades,
            totalPromosMonto,
            totalCambiosUnidades,
            totalCambiosMonto
          };
        });
      }, [rutasData, diaActivo, infoDiaSeleccionado, infoHoyReal]);

      const metricasGlobalesEmpresa = useMemo(() => {
        const fechaObjetivoIso = infoDiaSeleccionado?.iso;
        let totalBruta = 0, totalCambios = 0, totalEfectivo = 0, totalTransferencia = 0, totalCtaCte = 0;
        let totalClientesActivos = 0, totalClientesConGps = 0, totalClientesNuevos = 0;
        const boletasLista = [];
        const resumenRutas = [];
        const prodMap = {};

        Object.entries(rutasData).forEach(([rId, lista]) => {
          let rNeta = 0, rVis = 0;
          lista.forEach((cli) => {
            if (!cli.esOtrasVentas) {
              totalClientesActivos += 1;
              if (cli.lat !== null && cli.lng !== null) totalClientesConGps += 1;
              if (cli.esNuevo) totalClientesNuevos += 1;
            }
            const opsDelDia = [];
            (cli.historialPrevio || []).forEach((h) => {
              if (h.fecha === fechaObjetivoIso) opsDelDia.push(h);
            });
            if (cli.estado === 'Visitado' && cli.ultimaOperacion) {
              const fOp = cli.ultimaOperacion.fecha || infoHoyReal?.iso;
              if (fOp === fechaObjetivoIso) opsDelDia.push(cli.ultimaOperacion);
            }
            if (opsDelDia.length > 0 && !cli.esOtrasVentas) rVis += 1;

            opsDelDia.forEach((op) => {
              totalBruta += op.totalVenta || 0;
              totalCambios += op.totalCambio || 0;
              rNeta += op.neto || 0;
              if (op.metodoPago === 'Efectivo') totalEfectivo += op.neto || 0;
              if (op.metodoPago === 'Transferencia') totalTransferencia += op.neto || 0;
              if (op.metodoPago === 'Cuenta Corriente') totalCtaCte += op.neto || 0;
              boletasLista.push({ ...cli, rutaId: rId, ultimaOperacion: op });
              Object.entries(op.itemsVendidos || {}).forEach(([pid, q]) => {
                if (!prodMap[pid]) prodMap[pid] = { vendidos: 0, ingresos: 0 };
                const pObj = CATALOGO_PRODUCTOS.find((p) => p.id === pid);
                prodMap[pid].vendidos += q;
                prodMap[pid].ingresos += (pObj ? pObj.precio : 0) * q;
              });
            });
          });
          resumenRutas.push({
            rutaId: rId,
            nombreRuta: NOMBRES_RUTAS[rId] || rId,
            ventaNeta: rNeta,
            visitados: rVis,
            clientesCount: lista.filter((c) => !c.esOtrasVentas).length
          });
        });

        const rankingProductos = CATALOGO_PRODUCTOS.map((p) => ({
          ...p,
          vendidos: prodMap[p.id]?.vendidos || 0,
          ingresos: prodMap[p.id]?.ingresos || 0
        })).sort((a, b) => b.ingresos - a.ingresos);

        return {
          totalBruta,
          totalCambios,
          totalNeta: totalBruta - totalCambios,
          totalEfectivo,
          totalTransferencia,
          totalCtaCte,
          totalClientesActivos,
          totalClientesConGps,
          totalClientesNuevos,
          boletasLista,
          resumenRutas,
          rankingProductos
        };
      }, [rutasData, infoDiaSeleccionado, infoHoyReal]);

      const coberturaGpsPct = metricasGlobalesEmpresa.totalClientesActivos > 0
        ? Math.round((metricasGlobalesEmpresa.totalClientesConGps / metricasGlobalesEmpresa.totalClientesActivos) * 100)
        : 0;

          );

      const enviarMensajeWhatsAppDesdePadron = () => {

        });
        const csv = '\uFEFF' + filas.map((r) => r.join(';')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Ventas_BuendiaPan_${infoDiaSeleccionado.iso}.csv`;

        pendientesPorCerrar: clientesConAlertaHorario.filter((c) => c.estado === 'Pendiente' && c.infoHorario.estado === 'por_cerrar')

      const clientesFiltrados = useMemo(() => {
        const q = busquedaCliente.toLowerCase();
        return clientesConAlertaHorario.filter((c) => {

          if (filtroEstado === 'Pendientes' && c.estado !== 'Pendiente') return false;
          if (filtroEstado === 'Visitados' && c.estado !== 'Visitado') return false;
          if (!q) return true;
          return c.nombre.toLowerCase().includes(q) || (c.direccion || '').toLowerCase().includes(q);

      const abrirNavegacionGoogleMaps = (cli) => {

        setCantidadesCambio(cli.ultimaOperacion?.itemsCambiados || {});
        setCantidadesPromo(cli.ultimaOperacion?.itemsPromocion || {});
        setMetodoPago(cli.ultimaOperacion?.metodoPago || 'Efectivo');
        setGarantiaVerificada(false);
      };

      const ajustarCantidad = (tipo, pid, delta) => {
        const setter = tipo === 'venta' ? setCantidadesVenta : tipo === 'cambio' ? setCantidadesCambio : setCantidadesPromo;
        setter((prev) => ({ ...prev, [pid]: Math.max(0, (prev[pid] || 0) + delta) }));
      };

      const confirmarPedidoCliente = () => {
        let totalVenta = 0, totalCambio = 0, totalPromoValor = 0;
        CATALOGO_PRODUCTOS.forEach((p) => {
          totalVenta += (cantidadesVenta[p.id] || 0) * p.precio;
          totalCambio += (cantidadesCambio[p.id] || 0) * p.precio;
          totalPromoValor += (cantidadesPromo[p.id] || 0) * p.precio;
        });
        const op = {
          fecha: infoHoyReal.iso,
          numeroComprobante: `${rutaActivaId}-${Math.floor(100 + Math.random() * 899)}`,
          hora: horaActualFormateada,
          totalVenta,
          totalCambio,
          totalPromoValor,
          neto: totalVenta - totalCambio,
          metodoPago,
          itemsVendidos: cantidadesVenta,
          itemsCambiados: cantidadesCambio,
          itemsPromocion: cantidadesPromo
        };
        setRutasData((prev) => ({
          ...prev,
          [rutaActivaId]: prev[rutaActivaId].map((c) =>
            c.id === clienteActivoId ? { ...c, estado: 'Visitado', ultimaOperacion: op } : c

        const msg = `*BUENDÍA PAN — Comprobante #${op.numeroComprobante}*\nComercio: ${cli.nombre}\nTotal Neto: *${formatARS(op.neto)}* (${op.metodoPago})`;

                              <div key={vKey} className="bg-white p-2 rounded-xl border border-emerald-200">
                                <span className="font-black block text-[#1E1B18]">{rep.nombre}</span>
                                <span className="text-emerald-800 font-extrabold">{rep.ops} ops • {formatARS(rep.monto)}</span>
                              </div>
                            ))}
                          </div>
                        )}
                        <div className="max-h-36 overflow-y-auto space-y-1 pt-1">
                          {Object.entries(resumenImportacion.detallePorFecha || {}).sort((a, b) => a[0].localeCompare(b[0])).map(([fIso, info]) => (
                            <div key={fIso} className="flex justify-between items-center text-[11px] bg-white px-2.5 py-1 rounded-lg border border-emerald-100">
                              <span className="font-bold">📅 {info.dia} {fIso} ({info.archivo})</span>
                              <span className="font-black text-emerald-800">{info.ops} ops • {formatARS(info.monto)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    <button type="button" onClick={() => setMostrarImportadorExcel(false)} className="w-full py-2.5 rounded-xl bg-stone-900 text-amber-300 font-black">Cerrar y Ver en Planilla Matriz</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ============================================================================
      // 3. VISTA MÓVIL (IPHONE / CAMIONETA DE REPARTO EN CALLE)
      // ============================================================================
      return (
        <div className="min-h-screen bg-[#FFFBF7] text-[#1E1B18] flex justify-center">
          <div className="w-full max-w-md bg-[#FFFBF7] min-h-screen flex flex-col shadow-xl border-x border-amber-900/10">
            <header className="bg-gradient-to-br from-[#E11D2E] via-[#C8102E] to-[#990B1E] text-white safe-top px-4 pb-4 rounded-b-3xl shadow-lg sticky top-0 z-30">
              <div className="flex items-center justify-between gap-2 mb-3">
                <LogoBuendiaPan />
                <div className="flex items-center gap-1.5">
                  {!esVendedor && (
                    <button type="button" onClick={() => setVistaEntorno('escritorio')} className="px-2.5 py-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-amber-300 text-[11px] font-black">
                      ← Tablero PC
                    </button>
                  )}
                  <button type="button" onClick={cerrarSesion} className="px-2.5 py-1.5 rounded-xl bg-black/25 text-white text-[11px] font-bold">
                    Salir
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between gap-2 mb-2.5">
                {esVendedor ? (
                  <div className="text-xs font-black bg-black/20 px-3 py-1.5 rounded-xl">
                    🚛 {vendedorObj.nombre} ({vendedorObj.vehiculo})
                  </div>
                ) : (
                  <div className="flex gap-1 bg-black/20 p-1 rounded-xl">
                    {['A', 'B', 'C'].map((v) => (
                      <button key={v} type="button" onClick={() => setVendedorId(v)} className={`px-2.5 py-1 rounded-lg text-xs font-black ${vendedorId === v ? 'bg-white text-[#E11D2E]' : 'text-red-100'}`}>
                        Vend. {v}
                      </button>
                    ))}
                  </div>
                )}

                <select value={diaActivo} onChange={(e) => setDiaActivo(e.target.value)} className="bg-black/25 text-white text-xs font-extrabold px-2.5 py-1.5 rounded-xl border border-white/20">
                  {DIAS_SEMANA.map((d) => <option key={d} value={d} className="text-black">{d}</option>)}
                </select>
              </div>

              <div className="bg-black/20 rounded-2xl p-3 space-y-1.5 border border-white/10">
                <div className="flex justify-between items-center text-xs">
                  <span className="font-black text-amber-300">{rutaActivaId || 'SIN RUTA'} • {rutaActivaNombre}</span>
                  <span className="font-extrabold">{metricas.porcentajeObjetivo}% meta</span>
                </div>
                <div className="w-full h-2 bg-black/30 rounded-full overflow-hidden">
                  <div className="h-full bg-amber-300 rounded-full transition-all" style={{ width: `${Math.min(100, metricas.porcentajeObjetivo)}%` }} />
                </div>
                <div className="flex justify-between text-[11px] text-red-100">
                  <span>Neto: <strong className="text-white">{formatARS(metricas.ventaNeta)}</strong></span>
                  <span>{objetivoDia > 0 ? (metricas.faltaObjetivo > 0 ? `Faltan ${formatARS(metricas.faltaObjetivo)}` : `Superado +${formatARS(metricas.superadoObjetivo)}`) : 'Sin meta fija'}</span>
                </div>
              </div>
            </header>

            {toastMsg && (
              <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl shadow-xl text-xs font-extrabold text-white ${toastMsg.tipo === 'error' ? 'bg-stone-900' : 'bg-emerald-700'}`}>
                {toastMsg.texto}
              </div>
            )}

            <main className="flex-1 p-4 space-y-3 pb-24">
              {tabActiva === 'ruta' && (
                <>
                  <div className="bg-white rounded-2xl p-3 border border-amber-900/10 shadow-xs space-y-2">
                    <div className="flex gap-2">
                      <div className="relative flex-1">
                        <Icon name="search" className="w-4 h-4 text-stone-400 absolute left-3 top-1/2 -translate-y-1/2" />
                        <input type="text" placeholder="Buscar comercio..." value={busquedaCliente} onChange={(e) => setBusquedaCliente(e.target.value)} className="w-full pl-9 pr-3 py-2 bg-[#FFF8F0] border border-amber-900/15 rounded-xl text-xs" />
                      </div>
                      <button type="button" onClick={abrirAltaClienteModal} className="px-3 py-2 rounded-xl bg-emerald-600 text-white text-xs font-black shrink-0">
                        + Cliente
                      </button>
                    </div>
                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
                      {[{ id: 'Todos', label: `Todos (${clientesRuta.length})` }, { id: 'PorCerrar', label: `Por cerrar (${resumenAlertasCierre.pendientesPorCerrar.length})` }, { id: 'Pendientes', label: 'Pendientes' }, { id: 'Visitados', label: 'Visitados' }].map((f) => (
                        <button key={f.id} type="button" onClick={() => setFiltroEstado(f.id)} className={`px-2.5 py-1 rounded-lg text-[11px] font-extrabold whitespace-nowrap ${filtroEstado === f.id ? 'bg-[#E11D2E] text-white' : 'bg-[#FFF8F0] text-stone-600'}`}>
                          {f.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2.5">
                    {clientesFiltrados.map((cliente) => {
                      const esVisitado = cliente.estado === 'Visitado';
                      const hInfo = cliente.infoHorario;
                      return (
                        <div key={cliente.id} className={`bg-white rounded-2xl p-3.5 border shadow-xs ${esVisitado ? 'border-emerald-300' : 'border-amber-900/10'}`}>
                          <div className="flex justify-between items-start gap-2 mb-2">
                            <div>
                              <div className="flex items-center gap-1.5 flex-wrap mb-1">
                                <span className="text-[10px] font-black text-[#E11D2E] bg-[#FFF8F0] px-1.5 py-0.5 rounded">#{cliente.orden} • {cliente.id}</span>
                                <span className="text-[10px] font-bold bg-stone-100 text-stone-700 px-1.5 py-0.5 rounded">{hInfo.texto}</span>
                              </div>
                              <h3 className="font-black text-sm text-[#1E1B18]">{cliente.nombre}</h3>
                              <p className="text-xs text-stone-500">{cliente.direccion} • <strong>{cliente.localidad}</strong></p>
                            </div>
                            {esVisitado && cliente.ultimaOperacion && (
                              <span className="text-xs font-black text-emerald-800 bg-emerald-50 px-2 py-1 rounded-xl border border-emerald-200">
                                {formatARS(cliente.ultimaOperacion.neto)}
                              </span>
                            )}
                          </div>

                          <div className="grid grid-cols-3 gap-1.5 pt-1">
                            <button type="button" onClick={() => abrirNavegacionGoogleMaps(cliente)} className="py-2 px-2 rounded-xl bg-blue-600 text-white text-xs font-extrabold flex items-center justify-center gap-1">
                              <Icon name="navigation" className="w-3.5 h-3.5" />
                              <span>Llegar</span>
                            </button>
                            <button type="button" onClick={() => abrirOperacionCliente(cliente)} className="py-2 px-2 rounded-xl bg-[#E11D2E] text-white text-xs font-black">
                              {esVisitado ? 'Editar' : 'Vender'}
                            </button>
                            {esVisitado ? (
                              <button type="button" onClick={() => compartirBoletaWhatsApp(cliente)} className="py-2 px-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">
                                Boleta WA
                              </button>
                            ) : (
                              <button type="button" onClick={() => marcarSinCompra(cliente.id)} className="py-2 px-2 rounded-xl bg-stone-100 text-stone-700 text-xs font-bold">
                                Sin Compra
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}

              {tabActiva === 'stock' && (
                <div className="bg-white rounded-3xl p-4 border border-amber-900/10 space-y-2">
                  <h3 className="text-sm font-black">Stock Disponible en Camioneta</h3>
                  {CATALOGO_PRODUCTOS.map((p) => (
                    <div key={p.id} className="flex justify-between items-center p-2.5 rounded-xl bg-[#FFF8F0] text-xs">
                      <div>
                        <span className="font-bold block">{p.nombre}</span>
                        <span className="text-[10px] text-stone-500">{formatARS(p.precio)} • Garantía {p.garantiaDias}d</span>
                      </div>
                      <span className="font-black text-sm text-[#E11D2E]">{p.preventa48 ? '48hs' : `${metricas.stockDisponible[p.id] || 0} u.`}</span>
                    </div>
                  ))}
                </div>
              )}

              {tabActiva === 'caja' && (
                <div className="bg-white rounded-3xl p-4 border border-amber-900/10 space-y-3 text-xs">
                  <h3 className="text-sm font-black">Rendición de Caja — {diaActivo}</h3>
                  <div className="grid grid-cols-2 gap-2">
                    <div className="p-3 rounded-2xl bg-emerald-50 border border-emerald-200">
                      <span className="text-[10px] text-emerald-700 block">Efectivo a Rendir</span>
                      <strong className="text-base text-emerald-950">{formatARS(metricas.recaudadoEfectivo)}</strong>
                    </div>
                    <div className="p-3 rounded-2xl bg-blue-50 border border-blue-200">
                      <span className="text-[10px] text-blue-700 block">Transferencias</span>
                      <strong className="text-base text-blue-950">{formatARS(metricas.recaudadoTransferencia)}</strong>
                    </div>
                    <div className="p-3 rounded-2xl bg-amber-50 border border-amber-200">
                      <span className="text-[10px] text-amber-800 block">Cuenta Corriente</span>
                      <strong className="text-base text-amber-950">{formatARS(metricas.saldoCtaCte)}</strong>
                    </div>
                    <div className="p-3 rounded-2xl bg-rose-50 border border-rose-200">
                      <span className="text-[10px] text-rose-700 block">Cambios Garantía</span>
                      <strong className="text-base text-rose-950">-{formatARS(metricas.totalCambios)}</strong>
                    </div>
                  </div>
                </div>
              )}
            </main>

            <nav className="fixed bottom-0 w-full max-w-md bg-white border-t border-amber-900/10 safe-bottom px-4 py-2 grid grid-cols-3 gap-2 z-30">
              {[
                { id: 'ruta', label: 'Hoja de Ruta', icon: 'store' },
                { id: 'stock', label: 'Stock Camioneta', icon: 'package' },
                { id: 'caja', label: 'Rendición & Meta', icon: 'receipt' }
              ].map((t) => (
                <button key={t.id} type="button" onClick={() => setTabActiva(t.id)} className={`py-2 rounded-2xl flex flex-col items-center gap-0.5 text-[11px] font-extrabold ${tabActiva === t.id ? 'bg-[#E11D2E] text-white' : 'text-stone-500'}`}>
                  <Icon name={t.icon} className="w-4 h-4" />
                  <span>{t.label}</span>
                </button>
              ))}
            </nav>

            {/* Modal Toma de Pedido / Cambios / Promociones */}
            {clienteModalObj && (
              <div className="fixed inset-0 z-50 bg-black/75 flex items-end sm:items-center justify-center">
                <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col overflow-hidden">
                  <div className="bg-[#1E1B18] text-white p-4 flex justify-between items-center shrink-0">
                    <div>
                      <span className="text-[10px] text-amber-300 font-extrabold uppercase">{clienteModalObj.id}</span>
                      <h3 className="text-sm font-black">{clienteModalObj.nombre}</h3>
                    </div>
                    <button type="button" onClick={() => setClienteActivoId(null)} className="p-1.5 rounded-full bg-white/10"><Icon name="x" className="w-4 h-4" /></button>
                  </div>

                  <div className="p-3 bg-[#FFF8F0] border-b grid grid-cols-3 gap-1.5 shrink-0">
                    {[
                      { id: 'venta', label: 'Venta ($)' },
                      { id: 'cambio', label: 'Cambio Garantía' },
                      { id: 'promo', label: '★ Promoción' }
                    ].map((m) => (
                      <button key={m.id} type="button" onClick={() => setModoOperacion(m.id)} className={`py-2 rounded-xl text-xs font-black ${modoOperacion === m.id ? 'bg-[#E11D2E] text-white' : 'bg-white text-stone-700'}`}>
                        {m.label}
                      </button>
                    ))}
                  </div>

                  <div className="p-3 overflow-y-auto space-y-2 flex-1 text-xs">
                    {CATALOGO_PRODUCTOS.map((p) => {
                      const qActual = modoOperacion === 'venta' ? cantidadesVenta[p.id] || 0 : modoOperacion === 'cambio' ? cantidadesCambio[p.id] || 0 : cantidadesPromo[p.id] || 0;
                      return (
                        <div key={p.id} className="flex items-center justify-between p-2.5 rounded-xl bg-stone-50 border border-stone-200">
                          <div>
                            <div className="font-bold text-[#1E1B18]">{p.nombre}</div>
                            <div className="text-[10px] text-stone-500">{formatARS(p.precio)} • Garantía {p.garantiaDias}d</div>
                          </div>
                          <div className="flex items-center gap-2">
                            <button type="button" onClick={() => ajustarCantidad(modoOperacion, p.id, -1)} className="w-7 h-7 rounded-lg bg-white border font-black">-</button>
                            <span className="w-6 text-center font-black">{qActual}</span>
                            <button type="button" onClick={() => ajustarCantidad(modoOperacion, p.id, 1)} className="w-7 h-7 rounded-lg bg-[#1E1B18] text-white font-black">+</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="p-4 bg-white border-t space-y-2.5 shrink-0 text-xs">
                    {Object.values(cantidadesCambio).some((v) => v > 0) && (
                      <label className="flex items-center gap-2 p-2 rounded-xl bg-amber-50 border border-amber-300 font-bold text-amber-950">
                        <input type="checkbox" checked={garantiaVerificada} onChange={(e) => setGarantiaVerificada(e.target.checked)} />
                        <span>Confirmo envase dentro de garantía (14d / 10d)</span>
                      </label>
                    )}
                    <div className="grid grid-cols-3 gap-1.5">
                      {['Efectivo', 'Transferencia', 'Cuenta Corriente'].map((mp) => (
                        <button key={mp} type="button" onClick={() => setMetodoPago(mp)} className={`py-1.5 rounded-xl font-extrabold text-[11px] border ${metodoPago === mp ? 'bg-stone-900 text-amber-300' : 'bg-stone-50 text-stone-700'}`}>
                          {mp}
                        </button>
                      ))}
                    </div>
                    <button type="button" onClick={confirmarPedidoCliente} className="w-full py-3 rounded-2xl bg-[#E11D2E] text-white font-black text-sm">
                      Confirmar Operación
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Alta Rápida Cliente */}
            {mostrarAltaCliente && (
              <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
                <form onSubmit={guardarNuevoCliente} className="bg-white w-full max-w-sm rounded-3xl p-4 space-y-3 text-xs">
                  <h3 className="text-sm font-black">Alta Rápida de Cliente en {rutaActivaId}</h3>
                  <input type="text" required placeholder="Nombre del Comercio" value={nuevoCliNombre} onChange={(e) => setNuevoCliNombre(e.target.value)} className="w-full px-3 py-2 bg-[#FFF8F0] border rounded-xl font-bold" />
                  <input type="text" required placeholder="Dirección" value={nuevoCliDireccion} onChange={(e) => setNuevoCliDireccion(e.target.value)} className="w-full px-3 py-2 bg-[#FFF8F0] border rounded-xl" />
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" placeholder="Localidad" value={nuevoCliLocalidad} onChange={(e) => setNuevoCliLocalidad(e.target.value)} className="px-3 py-2 bg-[#FFF8F0] border rounded-xl" />
                    <input type="text" placeholder="Teléfono" value={nuevoCliTelefono} onChange={(e) => setNuevoCliTelefono(e.target.value)} className="px-3 py-2 bg-[#FFF8F0] border rounded-xl" />
                  </div>
                  <button type="button" onClick={capturarGpsParaNuevoCliente} className="w-full py-2 rounded-xl bg-blue-600 text-white font-extrabold">
                    {capturandoGpsNuevo ? 'Obteniendo GPS...' : nuevoCliLat ? `GPS OK (${nuevoCliLat}, ${nuevoCliLng})` : 'Capturar GPS Actual'}
                  </button>
                  <div className="grid grid-cols-2 gap-2">
                    <button type="button" onClick={() => setMostrarAltaCliente(false)} className="py-2 rounded-xl bg-stone-200 font-bold">Cancelar</button>
                    <button type="submit" className="py-2 rounded-xl bg-emerald-600 text-white font-black">Guardar Cliente</button>
                  </div>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
